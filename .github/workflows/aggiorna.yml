{"name": "Aggiorna dati Bisenzio", "on": {"schedule": [{"cron": "4,19,34,49 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": {"group": "aggiorna-dati", "cancel-in-progress": false}, "jobs": {"aggiorna": {"runs-on": "ubuntu-latest", "timeout-minutes": 10, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"run": "pip install requests"}, {"name": "Scarica dati e calcola l'allerta", "env": {"TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}", "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"}, "run": "python scripts/aggiorna.py"}, {"name": "Salva i dati aggiornati", "run": "git config user.name aggiornamento-automatico && git config user.email actions@users.noreply.github.com && git add docs/data.json docs/storico.json && (git diff --cached --quiet || git commit -m 'Dati aggiornati') && (git push || (git pull --rebase && git push))"}]}}}
